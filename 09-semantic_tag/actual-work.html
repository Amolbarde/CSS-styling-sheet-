<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Semantic HTML Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: aliceblue;
        }

        header {
            background-color: navy;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: darkslategray;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        main {
            padding: 20px;
        }

        section {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
        }

        article {
            background-color: lightblue;
            padding: 15px;
        }

        aside {
            background-color: lightyellow;
            padding: 15px;
        }

        footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>My Website</h1>
        <p>Welcome to my website</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Main Content -->
    <main>

        <!-- Section -->
        <section id="home">
            <h2>Home Section</h2>
            <p>This is the main section of my website.</p>
        </section>

        <!-- Article -->
        <article>
            <h2>Java Programming</h2>
            <p>Java is a popular programming language.</p>
        </article>

        <br>

        <!-- Aside -->
        <aside>
            <h3>Related Information</h3>
            <p>Learn HTML, CSS and JavaScript.</p>
        </aside>

        <!-- Another Section -->
        <section id="about">
            <h2>About Us</h2>
            <p>This website teaches web development.</p>
        </section>

    </main>

    <!-- Footer -->
    <footer id="contact">
        <p>Copyright 2026 My Website</p>
    </footer>

</body>
</html>
