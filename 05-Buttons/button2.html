<!DOCTYPE html>
<html>
    <head>
        <style>
            .button{
                background-color: white;
                border: none;
                color: black;
                padding: 16px 32px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                font-size: 16px;
                margin: 4px 2px;
                transition-duration: 0.4s;
                cursor: pointer;
            }

            .button1{
                border: 2px solid red;
            }

            .button2{
                border:2px solid pink;
            }

            .button3{
                border:2px dashed blue;
            }

            .button1:hover{
                background-color: aqua;
            }

                  .button2:hover{
                background-color: rgb(5, 48, 167);
            }
               .button3:hover{
                background-color: rgb(209, 5, 73);
            }
        </style>
    </head>

    <body>
        <center>
            <button class="button button1">Login</button>
            <button class="button button2">Login</button>
            <button class="button button3">Login</button>
            
            
        </center>
    </body>
</html>
