<!DOCTYPE html>
<html>
<head>
<style>
ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  width: 200px;
  background-color: #f1f1f1;
  border: 1px solid #555555;
}

li a {
  display: block;
  color: black;
  padding: 8px 16px;
  text-decoration: none;
}

li {
  text-align: center;
  border-bottom: 1px solid red;
}

li:last-child {
  border-bottom: 10px solid pink;
}

li a.active {
  background-color: #18dfdf;
  color: white;
}

li a:hover:not(.active) {
  background-color: #555555;
  color: white;
}
</style>
</head>
<body>

<h2>Vertical Navbar with Border and Centered Text</h2>

<p>In this example, we center the navigation links and add a border to the navigation bar.</p>

<ul>
  <li><a class="active" href="#home">Home</a></li>
  <li><a href="#news">News</a></li>
  <li><a href="#contact">Contact</a></li>
  <li><a href="#about">About</a></li>
</ul>

<br>
<label for="password">Password:</label>

<input type="password" id="password">

<span id="message"></span>

<button type="button" onclick="checkPassword()">
    Check Password
</button>

<script>
    function checkPassword() {
        let password = document.getElementById("password").value;
        let message = document.getElementById("message");

        if (password.length < 8) {
            message.textContent =
                "Password must contain at least 8 characters.";

            message.style.color = "red";
        } else {
            message.textContent = "Password length is valid.";
            message.style.color = "green";
        }
    }
</script>
</body>
</html>
